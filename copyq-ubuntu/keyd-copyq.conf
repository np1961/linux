# Правый цифровой блок → CopyQ (Ubuntu, Wayland). Вписывает keyd-add.sh — руками не нужно.
# keyd сам запускает ~/.local/bin/cq (через command, без сочетаний GNOME) и сам жмёт Ctrl+C / Ctrl+V
# (keyd do) — на Wayland CopyQ этого не умеет. command нельзя ставить внутрь macro(), поэтому паузы — sleep.
# @CQ@ keyd-add.sh заменяет на «setpriv … от вашего пользователя … ~/.local/bin/cq» (keyd работает от root).

[main]
# история: правая N — показать запись N, правый 0 — вставить её
kp1 = command(@CQ@ preview 1)
kp2 = command(@CQ@ preview 2)
kp3 = command(@CQ@ preview 3)
kp4 = command(@CQ@ preview 4)
kp5 = command(@CQ@ preview 5)
kp6 = command(@CQ@ preview 6)
kp7 = command(@CQ@ preview 7)
kp8 = command(@CQ@ preview 8)
kp9 = command(@CQ@ preview 9)
kp0 = command(@CQ@ paste & sleep 0.25; keyd do C-v)
# удержание + / − включает слой слотов; короткое нажатие печатает + / − как обычно
kpplus = overload(cq_put, kpplus)
kpminus = overload(cq_get, kpminus)

# держишь правый + и жмёшь N: запомнить буфер → Ctrl+C → забрать в слот N
[cq_put]
kp1 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 1)
kp2 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 2)
kp3 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 3)
kp4 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 4)
kp5 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 5)
kp6 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 6)
kp7 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 7)
kp8 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 8)
kp9 = command(@CQ@ mark; keyd do C-c; sleep 0.35; @CQ@ put 9)

# держишь правый − и жмёшь N: слот N в буфер → Ctrl+V
[cq_get]
kp1 = command(@CQ@ get 1 & sleep 0.4; keyd do C-v)
kp2 = command(@CQ@ get 2 & sleep 0.4; keyd do C-v)
kp3 = command(@CQ@ get 3 & sleep 0.4; keyd do C-v)
kp4 = command(@CQ@ get 4 & sleep 0.4; keyd do C-v)
kp5 = command(@CQ@ get 5 & sleep 0.4; keyd do C-v)
kp6 = command(@CQ@ get 6 & sleep 0.4; keyd do C-v)
kp7 = command(@CQ@ get 7 & sleep 0.4; keyd do C-v)
kp8 = command(@CQ@ get 8 & sleep 0.4; keyd do C-v)
kp9 = command(@CQ@ get 9 & sleep 0.4; keyd do C-v)
